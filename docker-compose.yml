services:
  canivete:
    build: .
    container_name: canivete-digital
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_DRIVER=sqlite
      - SQLITE_PATH=/app/.data/canivete.db
    volumes:
      - canivete_data:/app/.data
    restart: unless-stopped

volumes:
  canivete_data:
